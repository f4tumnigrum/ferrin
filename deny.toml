# cargo-deny configuration (docs/03-engineering/05-ci-and-quality-gates.md §3)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # borrow-or-share (via fluent-uri <- referencing <- jsonschema)
    "MIT-0",
    # webpki-root-certs (Mozilla root store data, via rustls-platform-verifier)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies without a version requirement (`ferrin-testing` as a
# dev-dependency, dropped from published manifests by cargo) are not wildcards.
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "rustls only" },
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "native-tls", reason = "rustls only" },
    { crate = "async-trait", reason = "use RPITIT + Dyn adapters (ADR 0002)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
