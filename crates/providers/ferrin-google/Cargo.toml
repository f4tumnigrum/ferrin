[package]
name = "ferrin-google"
description = "Ferrin provider for Google Generative AI (Gemini): language, embedding, image, speech, transcription and video models, files, batches and Live API sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "sdk"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "ferrin_google"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
realtime = ["dep:tokio-tungstenite", "tokio-tungstenite/handshake", "tokio-tungstenite/rustls-tls-native-roots", "futures-util/sink", "tokio/net", "tokio/macros"]

[dependencies]
ferrin-spec = { workspace = true }
ferrin-provider-util = { workspace = true, features = ["reqwest"] }
ferrin-tool = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
ferrin-testing = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
insta = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "generate_content"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
