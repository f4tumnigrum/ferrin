[package]
name = "ferrin-core"
description = "Ferrin core: text generation loop, streaming pipeline, structured output, agents, middleware, registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "sdk"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "ferrin_core"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["video"]
video = []
realtime = [
    "dep:tokio-tungstenite",
    "tokio-tungstenite/connect",
    "tokio-tungstenite/rustls-tls-native-roots",
    "futures-util/sink",
]
sandbox = ["ferrin-tool/sandbox"]

[dependencies]
ferrin-spec = { workspace = true }
ferrin-schema = { workspace = true }
ferrin-message = { workspace = true }
ferrin-tool = { workspace = true }
ferrin-provider-util = { workspace = true, features = ["reqwest"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
secrecy = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
tracing = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
ferrin-testing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
pretty_assertions = { workspace = true }
static_assertions = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "generate_text"
harness = false

[[bench]]
name = "stream_text"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
