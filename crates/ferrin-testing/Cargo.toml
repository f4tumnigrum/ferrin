[package]
name = "ferrin-testing"
description = "Ferrin testing support: mock models, fixture server, spec contract checks, event assertions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "sdk"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "ferrin_testing"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ferrin-spec = { workspace = true }
ferrin-provider-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
ferrin-provider-util = { workspace = true, features = ["reqwest"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
pretty_assertions = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
