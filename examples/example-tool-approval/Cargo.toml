[package]
name = "example-tool-approval"
description = "Ferrin example: tool calls that wait for human approval (not published)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "example-tool-approval"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ferrin = { workspace = true, features = ["openai"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
anyhow = { workspace = true }
