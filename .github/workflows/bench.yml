name: bench

# Manual only: benchmark numbers from shared runners are indicative, not a
# quality gate. The criterion report is kept as a build artifact.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: Benchmark name filter passed to criterion (empty runs everything)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  criterion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the benchmarks
        run: cargo bench --workspace --all-features ${FILTER:+-- "$FILTER"}
        env:
          RUST_MIN_STACK: 8388608
          FILTER: ${{ inputs.filter }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 30
