name: versions

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: check
        run: |
          cargo xtask check-versions > outdated.md || echo "outdated=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Outdated dependencies (weekly check)"
          content-filepath: outdated.md
          labels: dependencies

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - id: check
        run: |
          status=0
          {
            echo '```'
            cargo deny check advisories 2>&1 || status=$?
            cargo deny --manifest-path verification/Cargo.toml check advisories 2>&1 || status=$?
            echo '```'
          } > advisories.md
          if [ "$status" -ne 0 ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.vulnerable == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Security advisories (weekly cargo deny check)"
          content-filepath: advisories.md
          labels: dependencies
