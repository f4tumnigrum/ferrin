name: versions

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: check
        run: |
          cargo xtask check-versions > outdated.md || echo "outdated=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Outdated dependencies (weekly check)"
          content-filepath: outdated.md
          labels: dependencies

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - id: check
        run: |
          status=0
          {
            echo '```'
            cargo deny check advisories 2>&1 || status=$?
            cargo deny --manifest-path verification/Cargo.toml check advisories 2>&1 || status=$?
            echo '```'
          } > advisories.md
          if [ "$status" -ne 0 ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.vulnerable == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Security advisories (weekly cargo deny check)"
          content-filepath: advisories.md
          labels: dependencies
