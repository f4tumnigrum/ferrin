name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify the tag matches the workspace version and every changelog has a section for it
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - "${GITHUB_REF_NAME}" "$(cargo xtask publish-order | tr '\n' ' ')" <<'EOF'
          import json, os, sys
          tag, crates = sys.argv[1], sys.argv[2].split()
          packages = {p["name"]: p for p in json.load(open("metadata.json"))["packages"]}
          version = packages[crates[0]]["version"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match workspace version {version}")
          missing = []
          for crate in crates:
              changelog = os.path.join(os.path.dirname(packages[crate]["manifest_path"]), "CHANGELOG.md")
              if f"## [{version}]" not in open(changelog).read():
                  missing.append(crate)
          if missing:
              sys.exit("CHANGELOG.md has no [" + version + "] section in: " + ", ".join(missing))
          print(f"{tag}: {len(crates)} crates ready")
          EOF
      - name: Publish the crates that are not on crates.io yet
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            pending=()
            for crate in $(cargo xtask publish-order); do
              if cargo info --registry crates-io "$crate@$version" >/dev/null 2>&1; then
                echo "$crate $version is already published"
              else
                pending+=(-p "$crate")
              fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              echo "every crate is published"
              exit 0
            fi
            # One invocation: Cargo orders the packages, makes them available to
            # each other's verification builds and waits for every upload to
            # reach the index before publishing its dependents.
            if cargo publish "${pending[@]}" --locked 2>&1 | tee publish.log; then
              exit 0
            fi
            # crates.io limits how many new crates an account may publish in a
            # short period and names the time after which the next one is
            # accepted. Wait for it and retry with whatever is still pending.
            if ! grep -q "429 Too Many Requests" publish.log; then
              exit 1
            fi
            retry_at=$(grep -oE 'try again after [A-Za-z]+, [0-9]+ [A-Za-z]+ [0-9]+ [0-9:]+ GMT' publish.log | head -1 | sed 's/^try again after //' || true)
            now=$(date -u +%s)
            resume=$(date -u -d "$retry_at" +%s 2>/dev/null || echo $((now + 600)))
            wait=$((resume - now + 20))
            [ "$wait" -lt 20 ] && wait=20
            echo "rate limited by crates.io; waiting ${wait}s (until ${retry_at:-the next refill}) before attempt $((attempt + 1))"
            sleep "$wait"
          done
          echo "still rate limited after 40 attempts"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Extract the release notes from the dated root changelog
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import pathlib, re, sys
          version = re.escape(sys.argv[1])
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(rf"^## \[{version}\].*?$(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if section is None:
              sys.exit("root changelog has no section for this release")
          pathlib.Path("RELEASE_NOTES.md").write_text(section.group(1).strip() + "\n")
          EOF
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: CHANGELOG.md
